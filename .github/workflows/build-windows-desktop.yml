
name: Build GestVolt Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'desktop/**'
      - 'electron/**'
      - 'assets/**'
      - 'public/**'
      - 'scripts/**'
      - 'types.d.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/build-windows-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Build desktop renderer
        run: npm run build

      - name: Package Windows installer and portable executable
        run: npx electron-builder --win --publish never

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: GestVolt-Windows-Desktop
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
